model:
  name: "meta-llama/Llama-3.1-70B-Instruct"
  api_base: "http://127.0.0.1:8000/v1"
  temperature: 0.1
  max_tokens: 4096

rag:
  enabled: true
  # Index scope presets — pick one at RUN time with `--scope` (indexer) /
  # the notebook SCOPE var. Not hard-coded: change scope without touching code.
  #   automotive : the AAOS stack (Car + automotive HAL + car apps)
  #   framework  : automotive + frameworks/base (fuller cross-layer coverage)
  #   full       : whole tree (real full-stack; needs a full checkout)
  scopes:
    automotive:
      - "packages/services/Car"
      - "hardware/interfaces/automotive"
      - "packages/apps/Car"
      - "vendor"
      - "device"
    framework:
      - "packages/services/Car"
      - "hardware/interfaces/automotive"
      - "packages/apps/Car"
      - "frameworks/base"
      - "frameworks/av"
      - "vendor"
      - "device"
    full:
      - "."
  default_scope: "automotive"
  # legacy flat list (still honored if `scopes`/--scope not used)
  index_roots:
    - "vendor"
    - "device"
    - "packages/apps"
    - "packages/services/Car"
    - "hardware/interfaces/automotive"
    - "frameworks/opt/car"
  customer_path_boost:
    - "vendor/"
    - "device/"
    - "oem"
    - "customer"
    - "vss"
    - "signal"
  embed_model: "Qwen/Qwen3-Embedding-0.6B"   # code-aware, covers Java/Kotlin/C++/AIDL + requirement text
  # NOTE: changing embed_model invalidates existing indexes (vectors live in a
  # different space). Re-index with --reset. The store manifest guard will refuse
  # to serve a mismatched index. Lighter alt: all-MiniLM-L6-v2 (NLP-only, no code).
  chunk_size: 1200
  chunk_overlap: 200
  top_k_vector: 20
  top_k_bm25: 20
  top_k_exact: 20
  top_k_final: 12
  index_dir: "indexes/chroma_aaos"        # legacy single-index (backward-compat)
  collection_name: "aaos_sdv_fullstack"

  # Multi-tenant stores (option B — physical isolation per customer).
  # When `stores_root` is set and a tenant is passed, retrieval uses
  # <stores_root>/_base/<ver> ∪ <stores_root>/<customer>/<project>/<ver>.
  stores_root: "indexes/stores"
  default_tenant:
    customer: "base"        # "base" => base-only (no customer overlay)
    project: "default"
    aosp_version: "aosp15"

  # Ranking stack: dense + BM25 + exact → RRF → code priors → cross-encoder
  ranking:
    rrf_k: 60                 # RRF constant
    rrf_pool: 30              # candidates into cross-encoder
    cross_encoder_enabled: true
    cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    ce_blend: 0.75            # weight of CE vs RRF+prior score
    prior_customer: 0.12      # path matches vendor/device/oem
    prior_customer_store: 0.06  # hit came from the isolated customer store
    prior_symbol_in_path: 0.10
    prior_hidl_penalty: 0.30  # down-weight legacy HIDL unless query is about HIDL

agent:
  max_tool_iters: 8          # hard cap on ReAct tool loops before finalize
  patch_max_tries: 2         # generate->parse-check->regenerate retries for the patch

stack:
  target_android: 15
  full_stack: true
  layers: ["hmi", "carservice", "aidl", "vhal", "vss", "native"]

retrieval:
  max_file_chars: 14000
  aosp_root: null

safety:
  auto_apply: false
  require_human_approval: true
  max_patch_lines: 250

logging:
  level: INFO

prompt:
  hints_dir: "hints"        # folder scanned for custom *.md hints
  hint_files: []            # extra explicit hint files (optional)
